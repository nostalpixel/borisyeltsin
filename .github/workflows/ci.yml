name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests
        env:
          TESTPG_REQUIRED: "1"
        run: |
          go mod verify
          go test ./...
      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: sqlc has no drift
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz
          tar -C /tmp -xzf /tmp/sqlc.tar.gz
          /tmp/sqlc generate
          git diff --exit-code
      - name: Interface copy is English
        run: "! grep -rnP '[\\x{0400}-\\x{04FF}]' web/src web/index.html internal/httpserver/dist/index.html"
      - name: Compose config
        run: POSTGRES_PASSWORD=ci docker compose config >/tmp/compose.resolved.yml
      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: npm audit (shipped dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t boriseltsyn:ci .
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed boriseltsyn:ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 and linux/arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 .

  smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      BORISELTSYN_VERSION: ci
      BOOTSTRAP_ORG_NAME: CI
      BOOTSTRAP_OIDC_ISSUER: https://auth.example.test/application/o/borisyeltsin/
      BOOTSTRAP_OIDC_SUBJECT: ci-subject
      BOOTSTRAP_EMAIL: ci@example.test
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: timeout 300 docker compose up -d --build --wait
      - name: Ready and serving the UI
        run: |
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS -D /tmp/headers -o /tmp/index.html http://127.0.0.1:8080/
          grep -qi "^content-security-policy:.*'wasm-unsafe-eval'" /tmp/headers
          grep -q '<div id="root">' /tmp/index.html
      - name: First admin invite
        run: docker compose exec -T boriseltsyn boriseltsyn bootstrap-invite | grep -q '^BOOTSTRAP_INVITE_TOKEN='
      - name: Restore drill
        run: scripts/restore-drill.sh
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Compose down
        if: always()
        run: docker compose down -v
