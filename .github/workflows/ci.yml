name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests
        env:
          TESTPG_REQUIRED: "1"
        run: |
          go mod verify
          go test ./...
      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: sqlc has no drift
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz
          tar -C /tmp -xzf /tmp/sqlc.tar.gz
          /tmp/sqlc generate
          git diff --exit-code
      - name: Interface copy is English
        run: "! grep -rnP '[\\x{0400}-\\x{04FF}]' web/src web/index.html internal/httpserver/dist/index.html"
      - name: Compose config
        run: POSTGRES_PASSWORD=ci docker compose config >/tmp/compose.resolved.yml
      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t boriseltsyn:ci .
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --exit-code 1 --severity CRITICAL --ignore-unfixed boriseltsyn:ci
