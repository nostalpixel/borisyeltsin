# BorisEltsyn and Postgres. Authentik stays outside this file.
# TLS terminates at an existing reverse proxy. Do not publish the database port.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boriseltsyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: boriseltsyn
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boriseltsyn -d boriseltsyn"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  boriseltsyn:
    image: boriseltsyn:${BORISELTSYN_VERSION:-dev}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://boriseltsyn:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/boriseltsyn?sslmode=disable
      HTTP_ADDR: ":8080"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_TTL: ${SESSION_TTL:-12h}
      ALERT_TIMEZONE: ${ALERT_TIMEZONE:-UTC}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_MFA_AMR: ${OIDC_MFA_AMR:-mfa,otp,totp,webauthn}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-}
      BOOTSTRAP_OIDC_ISSUER: ${BOOTSTRAP_OIDC_ISSUER:-}
      BOOTSTRAP_OIDC_SUBJECT: ${BOOTSTRAP_OIDC_SUBJECT:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
